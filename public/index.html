<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Persona Demo (Static + WebLLM)</title>
  <style>
    @font-face {
      font-family: "Comico";
      src: url("./fonts/Comico-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

     @font-face {
      font-family: "MFDianHui";
      src: url("./fonts/MFDianHui_Noncommercial-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    html,body {
      margin:0;
      height:100%;
      background:#0f0f11;
      color:#fff;
      font-family:system-ui,-apple-system,Segoe UI,Roboto;
    }
    html, body, .wrap {
      font-family: "MFDianHui", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    :lang(en), [lang^="en"] {
     font-family: "Comico", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .wrap {
      position:relative;
      height:100vh;
      overflow:hidden;
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
    }
    .wrap.theme-neutral {
      background-image:url("./img/bg-neutral.png");
    }
    .wrap.theme-abstract {
      background-image:url("./img/bg-abstract.png");
    }
    .wrap.theme-literary {
      background-image:url("./img/bg-literary.png");
    }

    #bg {
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:1;
  mix-blend-mode:normal;
}

    .persona {
      position:absolute;
      inset:auto 0 0% 0;
      margin:auto;
      width:1080px;
      z-index:3;
      filter:drop-shadow(0 12px 40px rgba(0,0,0,.6));
      transform-origin:50% 100%;
    }

    .ui {
      position:absolute;
      top:12px;
      left:12px;
      z-index:4;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
:root { --ui-stroke: rgba(0,0,0,.45); }

.ui .btn,
.ui .badge{
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  color: #fff !important;
  font-weight: 700;
  -webkit-text-stroke: 0.8px var(--ui-stroke);
  text-shadow:
    1px 0 0 var(--ui-stroke),
   -1px 0 0 var(--ui-stroke),
    0 1px 0 var(--ui-stroke),
    0 -1px 0 var(--ui-stroke),
    1px 1px 0 var(--ui-stroke),
   -1px 1px 0 var(--ui-stroke),
    1px -1px 0 var(--ui-stroke),
   -1px -1px 0 var(--ui-stroke);
}
.ui .btn{
  padding: 8px 12px;
  cursor: pointer;
  user-select: none;
  border-radius: 12px; 
}
.ui .badge{ padding: 4px 10px; border-radius: 12px; }

.ui .btn:hover{ opacity: .9; }
.ui .btn:active{ transform: translateY(1px); }
:root { --ui-font-size: clamp(14px, 1.2vw, 20px); }

.ui{
  font-size: var(--ui-font-size);
}

.ui .btn,
.ui .badge{
  font-size: 1em;
  line-height: 1;
  font-weight: 700;
  letter-spacing: 0.2px;
}

    .bubble {
      position:absolute;
      left:50%;
      bottom:20px;
      transform:translateX(-50%);
      box-sizing:border-box;
      width: clamp(420px, 50vw, 960px);
      height:15vh;
      max-height:20vh;

      padding:16px 20px;
      background:rgba(255,255,255,0.94);
      color:#111;
      border-radius:18px 18px 18px 18px;
      border:1px solid rgba(0,0,0,0.25);

      z-index:5;
      pointer-events:none;

      display:flex;
      align-items:center;
      justify-content:center;
      text-align:left;
      font-size:clamp(16px, 1.4vw, 20px);
      line-height:1.5;
      overflow:hidden;
      white-space:normal;
    }
  
    .bubble:lang(zh),
    .bubble:lang(zh-Hans),
    .bubble[lang^="zh"]{
      font-size: clamp(20px, 1.8vw, 24px);
      line-height: 1.6;
    }

    .flash {
      position:absolute;
      inset:0;
      background:rgba(255,255,255,0);
      z-index:2;
      pointer-events:none;
    }

    .cloud{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
}

.tag{
  position:absolute;
  pointer-events:auto;
  display:inline-block;
  padding:0;
  background:transparent;
  border:none;
  color:#FF8A00;
  font-size:20px;
  font-weight:700;
  line-height:1;
  letter-spacing:0.2px;
  text-shadow:0 1px 2px rgba(0,0,0,.35);
}
.tag:lang(zh),
.tag:lang(zh-Hans),
.tag[lang^="zh"]{
  font-size: 28px;
  letter-spacing: 0.1px;
}
.tag[data-type="abstract"],
.tag[data-type="literary"]{
  border: none;
}

.intro {
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background: rgba(0,0,0,0.12);
}

.intro-card{
  width: min(50vw, 900px);
  height: min(50vh, 520px);
  padding: 28px 28px 22px;
  box-sizing: border-box;

  background: rgba(255,255,255,0.82);
  color:#111;
  border: 1px solid rgba(0,0,0,0.18);
  border-radius: 22px;
  box-shadow: 0 18px 60px rgba(0,0,0,0.25);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap: 18px;
  text-align:center;
}

.intro-text{
  font-size: clamp(18px, 2vw, 28px);
  line-height: 1.35;
  font-weight: 700;
  letter-spacing: .2px;
}

.intro-start{
  border: 1px solid rgba(0,0,0,0.25);
  background: rgba(255,255,255,0.65);
  color:#111;
  padding: 10px 18px;
  border-radius: 14px;
  cursor:pointer;
  font-weight: 800;
  font-size: 16px;
}

.intro-start:hover{ filter: brightness(1.02); }
.intro-start:active{ transform: translateY(1px); }
.wrap.is-locked .tag { pointer-events:none; opacity:.65; }
.wrap.is-locked #reset-btn { pointer-events:none; opacity:.65; }
.toast {
  position: absolute;
  top: 18px;
  right: 18px;
  z-index: 30;
  pointer-events: none;
  width: min(420px, 44vw);
  padding: 14px 16px;
  box-sizing: border-box;
  background: rgba(255,255,255,0.82);
  color: #111;
  border: 1px solid rgba(0,0,0,0.18);
  border-radius: 16px;
  box-shadow: 0 14px 40px rgba(0,0,0,0.18);
  font-size: 14px;
  line-height: 1.45;
}
.toast .toast-zh { font-weight: 700; }
.toast .toast-en { margin-top: 6px; opacity: 0.85; }


  </style>
</head>
<body>
  <div class="wrap theme-neutral" id="wrap">
    <div id="bg"></div>
    <img id="persona" class="persona" src="./img/person-neutral.png" alt="persona" />
    <div class="ui">
      <button class="btn" id="reset-btn">Reset</button>
      <span class="badge" id="stats" style="display:none">Abstract 0 · Literary 0</span>
      <span class="badge" id="mode" style="display:none">Neutral</span>
    </div>
    <div id="intro" class="intro" aria-label="intro">
     <div class="intro-card">
      <div class="intro-text">你想让它听到什么？<br/>What do you want it to hear?</div>
      <button id="start-btn" class="intro-start">Start</button>
     </div>
    </div>
    <div id="cloud" class="cloud" aria-label="word-cloud"></div>
    <div class="flash" id="flash"></div>
  </div>
  <script src="https://unpkg.com/p5@1.9.3/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
